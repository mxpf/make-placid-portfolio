name: Publish Make Placid demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: make-placid-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the template
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Verify the template at the domain root
        run: npm test

      - name: Build the project-site demo
        env:
          NEXT_PUBLIC_BASE_PATH: /make-placid-portfolio
          NEXT_PUBLIC_SITE_URL: https://mxpf.github.io/make-placid-portfolio
        run: |
          npm run build
          npm run verify:export

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
